[project]
name = "pinkeye-agent-runtime"
version = "0.1.0"
description = "Pinkeye agent runtime: sandboxed security tools, normalizers, orchestrator."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "docker>=7.0",
    # LLM provider SDKs. Imported lazily in runtime/llm/*, but must be present in any real
    # deployment — the default provider (ollama) speaks the OpenAI-compatible API via `openai`,
    # and `anthropic` backs the claude provider / fallback. Without these, agent runs fail on the
    # first model call with ModuleNotFoundError.
    "openai>=1.30",
    "anthropic>=0.34",
    # Official MCP SDK: drives pooled, warm stdio sessions to hosted MCP servers (runtime/mcp/session.py).
    # The dependency-free client.py remains for one-shot/non-pooled use and tests.
    "mcp>=1.0",
    # Shares scope guard, models, audit, and graph client with the control plane.
    "pinkeye-control-plane",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*"]

# The persona roster ships *inside* the package. Without this, `packages.find` collects only .py
# files and `agents.toml` never reaches site-packages — the installed image would silently fall back
# to the built-in roster literal in personas.py, and the config file an operator is meant to edit
# would not exist in the container at all. A deployment where the documented knob is absent but
# everything still "works" is the worst version of this bug, so keep the data file packaged.
[tool.setuptools.package-data]
runtime = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
