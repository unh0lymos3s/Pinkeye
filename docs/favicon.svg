  <circle cx="32" cy="32" r="21" fill="#fdfbfa"/>
  <g stroke="#e0202c" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M14 26c5 2 9 4 12 6"/>
    <path d="M50 39c-5-2-9-4-12-6"/>
  </g>
  <circle cx="32" cy="32" r="10" fill="#ff2da0" stroke="#5c0a37" stroke-width="2"/>
  <circle cx="32" cy="32" r="4" fill="#0d0208"/>
</svg>
